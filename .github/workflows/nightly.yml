# Nightly recompute and rebuild.
#
# The recency term in the weighting function decays without any write
# happening (§9.2), so weights are recomputed before the stats are. The static
# benchmark pages are then rebuilt so the pre-rendered HTML matches (§12.5).
#
# 20:30 UTC is 02:00 IST. Use pg_cron instead if the project has it.
name: nightly

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: run_nightly()
        run: |
          curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/rpc/run_nightly" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  rebuild:
    needs: recompute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Order matters: recompute (above), then bake, then export. Baking
      # before the recompute ships yesterday's numbers in today's HTML.
      - run: npx tsx scripts/sync-launch-set.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx tsx scripts/sync-benchmarks.ts
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npm run build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
      # Deploy `dist/` to Cloudflare Pages here.
